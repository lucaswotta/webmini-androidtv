name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    # Releases are published locally unless the repository variable is set.
    if: ${{ vars.WEBMINI_CI_RELEASE == 'true' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "platforms;android-36" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install Rust toolchain and cargo-ndk
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked --version 4.1.2
      - name: Check tag against versionName
        run: |
          version=$(sed -n "s/^[[:space:]]*versionName '\(.*\)'.*/\1/p" app/build.gradle)
          if [ -z "$version" ] || [ "$version" != "${RELEASE_TAG#v}" ]; then
            echo "tag $RELEASE_TAG does not match versionName $version"
            exit 1
          fi
      - name: Unpack release keystore
        env:
          WEBMINI_KEYSTORE_BASE64: ${{ secrets.WEBMINI_KEYSTORE_BASE64 }}
          WEBMINI_STORE_PASSWORD: ${{ secrets.WEBMINI_STORE_PASSWORD }}
          WEBMINI_KEY_ALIAS: ${{ secrets.WEBMINI_KEY_ALIAS }}
          WEBMINI_KEY_PASSWORD: ${{ secrets.WEBMINI_KEY_PASSWORD }}
        run: |
          if [ -z "$WEBMINI_KEYSTORE_BASE64" ] || [ -z "$WEBMINI_STORE_PASSWORD" ] \
              || [ -z "$WEBMINI_KEY_ALIAS" ] || [ -z "$WEBMINI_KEY_PASSWORD" ]; then
            echo "missing signing secret; create WEBMINI_KEYSTORE_BASE64, WEBMINI_STORE_PASSWORD,"
            echo "WEBMINI_KEY_ALIAS and WEBMINI_KEY_PASSWORD in the repository secrets"
            exit 1
          fi
          printf '%s' "$WEBMINI_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed release
        env:
          ORG_GRADLE_PROJECT_webminiStoreFile: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_webminiStorePassword: ${{ secrets.WEBMINI_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_webminiKeyAlias: ${{ secrets.WEBMINI_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_webminiKeyPassword: ${{ secrets.WEBMINI_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease :app:lintRelease
      - name: Check signature, ABI splits and JNI library
        env:
          EXPECTED_CERT_SHA256: AB:E8:D3:13:DC:19:19:CB:B4:6A:E4:9B:DC:CF:2C:BC:35:37:66:AF:2A:B3:FD:25:5B:3B:B2:90:39:14:57:37
        run: |
          dir="$GITHUB_WORKSPACE/app/build/outputs/apk/release"
          cd "$dir" || exit 1
          count=$(ls -1 ./*.apk | wc -l | tr -d ' ')
          if [ "$count" -ne 4 ]; then
            echo "expected 4 release APKs, found $count"
            ls -l
            exit 1
          fi
          for abi in armeabi-v7a arm64-v8a x86_64 universal; do
            set -- app-"$abi"-release*.apk
            if [ ! -f "$1" ] || [ -n "${2:-}" ]; then
              echo "expected one release APK for $abi, found: $*"
              exit 1
            fi
            apk=$1
            libs=$(unzip -Z1 "$apk" | awk '/^lib\//' | sort)
            if [ "$abi" = universal ]; then
              want=$(printf '%s\n' lib/arm64-v8a/libonepage_adblock.so lib/armeabi-v7a/libonepage_adblock.so lib/x86_64/libonepage_adblock.so)
            else
              want="lib/$abi/libonepage_adblock.so"
            fi
            if [ "$libs" != "$want" ]; then
              echo "$apk holds native libraries other than:"
              echo "$want"
              echo "found:"
              echo "$libs"
              exit 1
            fi
          done
          if ! grep -q "\"versionName\": \"${RELEASE_TAG#v}\"" output-metadata.json; then
            echo "output-metadata.json does not carry versionName ${RELEASE_TAG#v}"
            exit 1
          fi
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -z "$apksigner" ]; then
            echo "apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          expected=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')
          for apk in app-*.apk; do
            report=$("$apksigner" verify --print-certs "$apk")
            actual=$(printf '%s\n' "$report" \
                | sed -n 's/^Signer.* certificate SHA-256 digest: //p' \
                | tr -d ':' | tr '[:lower:]' '[:upper:]' | sort -u)
            if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
              echo "$apk is not signed with the published certificate: $actual"
              exit 1
            fi
          done
      - name: Name and checksum the APKs
        run: |
          cd "$GITHUB_WORKSPACE/app/build/outputs/apk/release" || exit 1
          for abi in universal armeabi-v7a arm64-v8a x86_64; do
            mv "app-$abi-release.apk" "OnePage-$abi.apk"
          done
          sha256sum OnePage-*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE/app/build/outputs/apk/release" || exit 1
          existing=$(gh api graphql -F owner="${GITHUB_REPOSITORY%/*}" \
            -F name="${GITHUB_REPOSITORY#*/}" -F tag="$RELEASE_TAG" \
            -f query='query($owner: String!, $name: String!, $tag: String!) { repository(owner: $owner, name: $name) { release(tagName: $tag) { id } } }' \
            --jq '.data.repository.release.id // empty')
          if [ -n "$existing" ]; then
            echo "Release $RELEASE_TAG already exists; preserving its files."
          else
            gh release create "$RELEASE_TAG" OnePage-*.apk SHA256SUMS.txt --verify-tag \
              --title "OnePage ${RELEASE_TAG#v}" --generate-notes
          fi
