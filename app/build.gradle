plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.lucaswotta.navegadorleve'
    compileSdk 36

    defaultConfig {
        applicationId 'br.com.lucaswotta.navegadorleve'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}
