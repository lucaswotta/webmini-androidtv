plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.lucaswotta.webmini'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.lucaswotta.webmini'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
    }

    def releaseStoreFile = providers.gradleProperty('webminiStoreFile').orNull
    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword providers.gradleProperty('webminiStorePassword').get()
                keyAlias providers.gradleProperty('webminiKeyAlias').get()
                keyPassword providers.gradleProperty('webminiKeyPassword').get()
            }
        }
    }

    // Android TV devices ship 32-bit and 64-bit ARM userspaces; x86_64 covers
    // the emulator. The universal APK is the safe default for sideloading.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            universalApk true
        }
    }

    sourceSets {
        main {
            jniLibs.srcDir(layout.buildDirectory.dir('generated/rust/jniLibs').get().asFile)
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            if (releaseStoreFile) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

def nativeLibraryOutput = layout.buildDirectory.dir('generated/rust/jniLibs')
def sdkProperties = new Properties()
def sdkPropertiesFile = rootProject.file('local.properties')
if (sdkPropertiesFile.isFile()) {
    sdkPropertiesFile.withInputStream { sdkProperties.load(it) }
}
def androidSdkPath = providers.environmentVariable('ANDROID_HOME')
        .orElse(providers.environmentVariable('ANDROID_SDK_ROOT'))
        .orElse(sdkProperties.getProperty('sdk.dir', '')).get()

tasks.register('buildNativeAdblock', Exec) {
    workingDir rootProject.file('native/adblock')
    inputs.files(fileTree('../native/adblock/src'), rootProject.file('native/adblock/Cargo.toml'),
            rootProject.file('native/adblock/Cargo.lock'))
    outputs.dir(nativeLibraryOutput)
    environment 'ANDROID_HOME', androidSdkPath
    environment 'PATH', new File(System.getProperty('user.home'), '.cargo/bin').absolutePath + File.pathSeparator + System.getenv('PATH')
    commandLine 'cargo', 'ndk',
            '-t', 'arm64-v8a', '-t', 'armeabi-v7a', '-t', 'x86_64',
            '-o', nativeLibraryOutput.get().asFile.absolutePath,
            'build', '--release', '--locked'
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('buildNativeAdblock')
}
